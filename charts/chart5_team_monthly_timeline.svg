<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="100%" height="500" style="background:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect width="850" height="500" fill="#ffffff" rx="8"/>
  <text x="425" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">臺北市各清潔工作團隊 12 個月份時間軸人力動態配置與調度變化</text>
  <text x="425" y="52" text-anchor="middle" font-size="12" fill="#64748b">六大專業團隊全年度出勤強度與人力跨組支援動態曲線（1月至12月）</text>

  <!-- Legend -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="14" height="14" fill="#2563eb" rx="2"/>
    <text x="20" y="12" font-size="12" fill="#334155">垃圾清運班</text>
    <rect x="115" y="0" width="14" height="14" fill="#059669" rx="2"/>
    <text x="135" y="12" font-size="12" fill="#334155">資源回收班</text>
    <rect x="235" y="0" width="14" height="14" fill="#f59e0b" rx="2"/>
    <text x="255" y="12" font-size="12" fill="#334155">道路清掃組</text>
    <rect x="355" y="0" width="14" height="14" fill="#06b6d4" rx="2"/>
    <text x="375" y="12" font-size="12" fill="#334155">清溝防汛班</text>
    <rect x="470" y="0" width="14" height="14" fill="#dc2626" rx="2"/>
    <text x="490" y="12" font-size="12" fill="#334155">防疫消毒班</text>
    <rect x="585" y="0" width="14" height="14" fill="#8b5cf6" rx="2"/>
    <text x="605" y="12" font-size="12" fill="#334155">公廁維護班</text>
  </g>

  <!-- Axes & Grid -->
  <line x1="80" y1="410" x2="780" y2="410" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="80" y1="110" x2="80" y2="410" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Y-ticks: Dynamic Index (80% to 150%) -->
  <text x="70" y="415" text-anchor="end" font-size="11" fill="#64748b">80%</text>
  <line x1="80" y1="410" x2="780" y2="410" stroke="#f1f5f9" stroke-dasharray="4"/>
  <text x="70" y="335" text-anchor="end" font-size="11" fill="#64748b">100% (基準)</text>
  <line x1="80" y1="330" x2="780" y2="330" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2"/>
  <text x="70" y="255" text-anchor="end" font-size="11" fill="#64748b">120%</text>
  <line x1="80" y1="250" x2="780" y2="250" stroke="#f1f5f9" stroke-dasharray="4"/>
  <text x="70" y="175" text-anchor="end" font-size="11" fill="#64748b">140%</text>
  <line x1="80" y1="170" x2="780" y2="170" stroke="#f1f5f9" stroke-dasharray="4"/>
  <text x="70" y="120" text-anchor="end" font-size="11" fill="#64748b">150% (極大)</text>

  <!-- Month X ticks: 1 to 12 -->
  <text x="120" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">1月</text>
  <line x1="120" y1="110" x2="120" y2="410" stroke="#f8fafc"/>
  <text x="176" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">2月</text>
  <line x1="176" y1="110" x2="176" y2="410" stroke="#f8fafc"/>
  <text x="232" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">3月</text>
  <line x1="232" y1="110" x2="232" y2="410" stroke="#f8fafc"/>
  <text x="288" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">4月</text>
  <line x1="288" y1="110" x2="288" y2="410" stroke="#f8fafc"/>
  <text x="344" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">5月</text>
  <line x1="344" y1="110" x2="344" y2="410" stroke="#f8fafc"/>
  <text x="400" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">6月</text>
  <line x1="400" y1="110" x2="400" y2="410" stroke="#f8fafc"/>
  <text x="456" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">7月</text>
  <line x1="456" y1="110" x2="456" y2="410" stroke="#f8fafc"/>
  <text x="512" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">8月</text>
  <line x1="512" y1="110" x2="512" y2="410" stroke="#f8fafc"/>
  <text x="568" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">9月</text>
  <line x1="568" y1="110" x2="568" y2="410" stroke="#f8fafc"/>
  <text x="624" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">10月</text>
  <line x1="624" y1="110" x2="624" y2="410" stroke="#f8fafc"/>
  <text x="680" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">11月</text>
  <line x1="680" y1="110" x2="680" y2="410" stroke="#f8fafc"/>
  <text x="736" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">12月</text>
  <line x1="736" y1="110" x2="736" y2="410" stroke="#f8fafc"/>
  <!-- Polylines -->
  <polyline points="120,150 176,370 232,350 288,338 344,310 400,298 456,258 512,266 568,310 624,322 680,330 736,290" fill="none" stroke="#059669" stroke-width="3.5"/>
  <polyline points="120,190 176,350 232,338 288,330 344,330 400,322 456,310 512,310 568,298 624,330 680,330 736,270" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="3"/>
  <polyline points="120,270 176,350 232,330 288,330 344,330 400,330 456,310 512,310 568,330 624,330 680,322 736,282" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <polyline points="120,390 176,370 232,230 288,190 344,210 400,250 456,290 512,270 568,310 624,350 680,370 736,390" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
  <polyline points="120,390 176,390 232,350 288,310 344,210 400,170 456,190 512,190 568,210 624,250 680,350 736,390" fill="none" stroke="#dc2626" stroke-width="3"/>

  <!-- Callout 1: Jan peak -->
  <rect x="130" y="115" width="150" height="40" fill="#ecfdf5" stroke="#6ee7b7" rx="4"/>
  <text x="138" y="132" font-size="10" font-weight="bold" fill="#065f46">1月：資收與清運超載</text>
  <text x="138" y="146" font-size="9" fill="#047857">年終大掃除，全員停休支援</text>

  <!-- Callout 2: April drain -->
  <rect x="260" y="180" width="135" height="40" fill="#ecfeff" stroke="#a5f3fc" rx="4"/>
  <text x="268" y="197" font-size="10" font-weight="bold" fill="#0e7490">3-4月：春季防汛疏濬</text>
  <text x="268" y="211" font-size="9" fill="#155e75">清溝班出勤頻率增 35%</text>

  <!-- Callout 3: June-August Disinfection -->
  <rect x="440" y="130" width="150" height="40" fill="#fef2f2" stroke="#fecaca" rx="4"/>
  <text x="448" y="147" font-size="10" font-weight="bold" fill="#991b1b">5-8月：夏季登革熱噴藥</text>
  <text x="448" y="161" font-size="9" fill="#b91c1c">消毒班全勤，防颱緊急待命</text>

  <!-- Callout 4: Dec countdown -->
  <rect x="650" y="230" width="130" height="40" fill="#fffbeb" stroke="#fde68a" rx="4"/>
  <text x="658" y="247" font-size="10" font-weight="bold" fill="#92400e">12月：跨年商圈高峰</text>
  <text x="658" y="261" font-size="9" fill="#b45309">信義/中山大夜班待命</text>

  <text x="425" y="475" text-anchor="middle" font-size="11" fill="#64748b">
    調配核心規律：清潔隊採「固定編制、季節調動」；平時各守分隊，遇 1 月大掃除、4 月防汛、6-8 月防疫與颱風，機動橫向調撥。
  </text>
</svg>